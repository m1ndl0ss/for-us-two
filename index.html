<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Для нас двоих</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<section class="opening" id="opening" aria-label="Наши воспоминания"><button class="skip" id="skip" aria-label="Пропустить вступление">×</button><div class="memory-deck"><figure class="memory m1"><img src="images/memory-1.png" alt="Мы вместе"></figure><figure class="memory m2"><img src="images/memory-2.png" alt="Мы вместе"></figure><figure class="memory m3"><img src="images/memory-3.png" alt="Мы вместе"></figure><figure class="memory m4"><img src="images/memory-4.png" alt="Мы вместе"></figure><figure class="memory m5"><img src="images/memory-5.png" alt="Мы вместе"></figure></div></section>
<main class="site hidden" id="site"><section class="hero" id="hero"><div class="hero-orbit orbit-a">✦</div><div class="hero-orbit orbit-b">✦</div><h1>Пойдёшь со мной<br><em>на виртуальное свидание?</em></h1><div class="answer-buttons"><button class="yes" id="yes">Да <span>♥</span></button><button class="no" id="no" type="button">нет</button></div><p class="no-message" id="no-message" aria-live="polite"></p></section>
<section class="planner hidden" id="planner"><header class="planner-head"><h2>Выбери время<br><em>для нас.</em></h2></header><div class="steps"><span class="active" id="progress-time">01 · время</span><span id="progress-activity">02 · свидание</span><span id="progress-done">03 · ура</span></div><form id="date-form"><section class="panel" id="step-time"><p class="field-label">Какой день тебе подходит?</p><div class="day-picker" id="day-picker" role="radiogroup" aria-label="Выбор дня"></div><input id="date" name="date" type="hidden" required><p class="hint" id="time-help"></p><div class="time-slots" id="time-slots"></div><input id="time" name="time" type="hidden" required><button class="primary" id="to-activities" type="button" disabled>Дальше <span>→</span></button></section>
<section class="panel hidden" id="step-activity"><h3>Что будет<br><em>в нашем плане?</em></h3><div class="activities"><label class="activity"><input type="radio" name="activity" value="Смотрим кино вместе" required><span class="activity-photo"><img src="images/activity-movie.png" alt="Котик смотрит кино"></span><b>Смотрим кино вместе</b><small>Можешь выбрать ты :)</small></label><label class="activity"><input type="radio" name="activity" value="Планируем путешествие вместе"><span class="activity-photo"><img src="images/activity-travel.png" alt="Котик планирует путешествие"></span><b>Планируем путешествие вместе</b><small>мб декабрь(?) :)</small></label><label class="activity"><input type="radio" name="activity" value="PowerPoint night"><span class="activity-photo"><img src="images/activity-powerpoint.png" alt="Котик готовит презентацию"></span><b>PowerPoint night</b><small>объясняем друг другу случайную тему :)</small></label><label class="activity"><input type="radio" name="activity" value="Pinterest board night"><span class="activity-photo"><img src="images/activity-pinterest.png" alt="Котик делает мудборд"></span><b>Pinterest board night</b><small>Собираем дом мечты на пинтересте</small></label><label class="activity"><input type="radio" name="activity" value="Personality quizzes"><span class="activity-photo"><img src="images/activity-quizzes.png" alt="Котик проходит тест"></span><b>Personality quizzes</b><small>смотрим какие мы котики в другой вселенной</small></label></div><label class="field-label note-label" for="note">Свой вариант <small>или секретное пожелание</small></label><textarea id="note" name="note" placeholder="Напиши свой вариант..."></textarea><button class="primary" type="submit">It's a date <span>♥</span></button><button class="back" type="button" id="back">← поменять время</button></section></form><section class="celebrate hidden" id="success"><div class="celebrate-photo"><img src="images/final-memory.png" alt="Мы вместе"></div><h2>Я уже очень<br><em>жду этого вечера.</em></h2><p id="success-text"></p><div class="hearts">♥ ♥ ♥</div></section></section></main><script src="app.js"></script></body></html>
